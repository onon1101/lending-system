basePath: /
definitions:
  model.CreateItemRequest:
    properties:
      description:
        type: string
      object_name:
        type: string
    type: object
  model.CreateLoanRequest:
    type: object
  model.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password_hash:
        type: string
    type: object
  model.GetAllItemsResponse:
    properties:
      current_status:
        type: string
      description:
        type: string
      image_url:
        type: string
      object_id:
        type: integer
      object_name:
        type: string
      owner_email:
        type: string
      owner_name:
        type: string
    type: object
  model.Item:
    properties:
      current_status:
        type: string
      description:
        type: string
      image_url:
        type: string
      object_id:
        type: integer
      object_name:
        type: string
    type: object
  model.LoanItemDetail:
    properties:
      actual_return_time:
        type: string
      detail_status:
        type: string
      object_detail_id:
        type: integer
      object_id:
        type: integer
      object_name:
        type: string
    type: object
  model.LoanRecord:
    properties:
      end_time:
        type: string
      name:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  model.Media:
    properties:
      created_at:
        type: string
      description:
        type: string
      link:
        type: string
      media_id:
        type: integer
      object_id:
        type: integer
      order_id:
        type: integer
      type:
        type: string
      url:
        type: string
    type: object
  model.UpdateItemRequest:
    properties:
      current_status:
        type: string
      description:
        type: string
      image_url:
        type: string
      object_name:
        type: string
    type: object
  model.UserLoanResponse:
    properties:
      end_time:
        type: string
      items:
        items:
          $ref: '#/definitions/model.LoanItemDetail'
        type: array
      order_id:
        type: integer
      order_status:
        type: string
      start_time:
        type: string
      user_id:
        type: integer
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8000
info:
  contact: {}
  description: 這是一個基於 Go 語言和 PostgreSQL 構建的物品借閱系統後端 API。
  title: 物品借閱系統 API
  version: "1.0"
paths:
  /api/health:
    get:
      description: 檢查服務是否正常運行
      produces:
      - text/plain
      responses:
        "200":
          description: Service is running!
          schema:
            type: string
      summary: 健康檢查
      tags:
      - System
  /api/items:
    get:
      description: 獲取系統中所有可供借閱的物品列表。
      produces:
      - application/json
      responses:
        "200":
          description: 成功回傳物品列表
          schema:
            items:
              $ref: '#/definitions/model.GetAllItemsResponse'
            type: array
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 查詢所有物品列表
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: 新增一個可供借閱的物品實體。
      parameters:
      - description: 物品創建請求
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 成功創建的物品記錄
          schema:
            $ref: '#/definitions/model.Item'
        "400":
          description: 請求資料格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 創建新物品
      tags:
      - Items
  /api/items/{object_id}:
    get:
      description: 根據物品 ID 查詢其詳細資訊。
      parameters:
      - description: 物品 ID
        in: path
        name: object_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功找到並回傳物品資訊
          schema:
            $ref: '#/definitions/model.Item'
        "404":
          description: 找不到指定 ID 的物品
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 查詢特定物品
      tags:
      - Items
    put:
      consumes:
      - application/json
      description: 根據物品 ID 更新物品名稱、描述或狀態。
      parameters:
      - description: 物品 ID
        in: path
        name: object_id
        required: true
        type: integer
      - description: 物品更新請求
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功更新的物品記錄
          schema:
            $ref: '#/definitions/model.Item'
        "400":
          description: 請求資料格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 找不到指定 ID 的物品
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 更新物品資訊
      tags:
      - Items
  /api/items/{object_id}/image:
    post:
      consumes:
      - multipart/form-data
      description: 上傳圖片並將返回的 URL 更新到指定的物品 (object_id)。
      parameters:
      - description: 物品 ID
        in: path
        name: object_id
        required: true
        type: integer
      - description: 圖片檔案 (Key must be 'file')
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 成功更新圖片 URL 的物品記錄
          schema:
            $ref: '#/definitions/model.Item'
        "400":
          description: 請求錯誤或檔案類型錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 找不到指定 ID 的物品
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 圖片上傳或資料庫更新失敗
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 上傳圖片封面
      tags:
      - Items
  /api/items/media:
    post:
      consumes:
      - multipart/form-data
      description: 上傳檔案並在資料庫建立媒體記錄，關聯到特定訂單與物品。
      parameters:
      - description: 媒體檔案
        in: formData
        name: file
        required: true
        type: file
      - description: 訂單 ID
        in: formData
        name: order_id
        type: integer
      - description: 物品 ID
        in: formData
        name: object_id
        required: true
        type: integer
      - description: 原始連結
        in: formData
        name: link
        type: string
      - description: 媒體描述
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: 成功建立的媒體記錄
          schema:
            $ref: '#/definitions/model.Media'
      summary: 上傳物品的媒體 (影片或圖片)
      tags:
      - Items
  /api/items/media/{object_id}:
    get:
      consumes:
      - application/json
      description: 根據物品 ID (object_id) 獲取該物品相關的所有媒體檔案（如照片與影片），包含檔案的 URL、類型與描述。
      parameters:
      - description: 物品 ID
        in: path
        name: object_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 媒體檔案列表
          schema:
            items:
              $ref: '#/definitions/model.Media'
            type: array
        "400":
          description: 無效的物品 ID 格式
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 無法取得媒體項目或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 取得物品的所有影音媒體
      tags:
      - Items
  /api/loans:
    post:
      consumes:
      - application/json
      description: 建立一筆新的借閱交易，並將所有指定物品的狀態更新為 'On Loan'。
      parameters:
      - description: 創建借閱請求
        in: body
        name: loan
        required: true
        schema:
          $ref: '#/definitions/model.CreateLoanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 成功創建的訂單記錄
          schema:
            $ref: '#/definitions/model.UserLoanResponse'
        "400":
          description: 請求資料格式錯誤或物品不可用
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 創建新的借閱訂單
      tags:
      - Loans
  /api/loans/items/history/{object_id}:
    get:
      consumes:
      - application/json
      description: 根據物品 ID (object_id) 獲取該物品過去所有的借閱紀錄，包含借閱者名稱、開始時間與預計歸還時間。
      parameters:
      - description: 物品 ID
        in: path
        name: object_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 借閱歷史紀錄列表
          schema:
            items:
              $ref: '#/definitions/model.LoanRecord'
            type: array
        "400":
          description: 無效的物品 ID 格式
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 伺服器內部錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 查詢物品借閱歷史紀錄
      tags:
      - Loans
  /api/status:
    get:
      description: 檢查 API 服務是否運行，以及 PostgreSQL 資料庫連線是否成功。
      produces:
      - application/json
      responses:
        "200":
          description: '狀態: ok, DB: ok'
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: '狀態: ok, DB: error'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 服務與資料庫健康檢查
      tags:
      - System
  /api/users:
    post:
      consumes:
      - application/json
      description: 註冊一個新的物品借閱系統使用者。
      parameters:
      - description: 使用者創建請求
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 成功創建的使用者記錄
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: 請求資料格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 建立新使用者
      tags:
      - Users
  /api/users/{user_id}:
    get:
      description: 根據使用者 ID (user_id) 查詢其詳細資訊。
      parameters:
      - description: 使用者 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功找到並回傳使用者資訊
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: ID 格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 找不到指定 ID 的使用者
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 使用者 ID 查詢特定使用者
      tags:
      - Users
  /api/users/{user_id}/loans:
    get:
      description: 根據使用者 ID 查詢該使用者所有尚未完全歸還或狀態為 'On Loan' 的訂單詳情。
      parameters:
      - description: 使用者 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功回傳借閱訂單列表
          schema:
            items:
              $ref: '#/definitions/model.UserLoanResponse'
            type: array
        "400":
          description: ID 格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 查詢特定使用者進行中的借閱記錄
      tags:
      - Loans
  /api/users/{username}:
    get:
      description: 根據使用者 Name 查詢其詳細資訊。
      parameters:
      - description: 使用者名稱
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功找到並回傳使用者資訊
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: 姓名格式錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 找不到指定姓名的使用者
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 內部伺服器或資料庫錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 使用者名稱查詢特定使用者
      tags:
      - Users
swagger: "2.0"
