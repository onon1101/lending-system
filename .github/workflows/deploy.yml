# .github/workflows/deploy.yml

name: CI/CD Deployment

on:
  push:
    branches:
      - main # 只有推送到 main 分支時觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # 確保可以同時取得兩個專案的程式碼
        with:
          repository: onon1101/lending-system # 假設這是您的 Monorepo

      # 1. 登入 Docker Hub 或其他註冊表 (如果需要發佈映像檔)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 2. SSH 連線到目標伺服器並部署
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}              # 您的伺服器 IP
          username: ${{ secrets.SSH_USERNAME }}      # 伺服器使用者名稱 (e.g., ubuntu)
          key: ${{ secrets.SSH_PRIVATE_KEY }}        # 私鑰 (儲存在 Secrets 中)
          script: |
            DEPLOY_DIR="/home/ubuntu/lending-system" 
             REPO_URL="https://github.com/${{ github.repository }}.git"

             echo "--- 1. 清理舊的 Docker 服務和部署目錄 ---"

             # 檢查部署目錄是否存在
             if [ -d "$DEPLOY_DIR" ]; then
                 echo "找到舊的部署目錄 ($DEPLOY_DIR)。"
                 cd $DEPLOY_DIR || exit 1
                 
                 # 停止並移除所有容器、網路和 Volume
                 # -v 會移除具名 Volume (例如 postgres_data, minio_data)
                 # --rmi all 會移除所有由 docker compose up 建立的映像檔
                 echo "正在停止並移除所有 Docker 容器、網路和 Volume..."
                 /usr/bin/docker compose down -v --rmi all
                 
                 # 返回使用者的家目錄
                 cd ~
                 
                 # 刪除部署目錄
                 echo "正在刪除部署目錄..."
                 rm -rf $DEPLOY_DIR
             else
                 echo "部署目錄不存在，跳過清理舊的 Docker 服務。"
             fi
             
             echo "--- 2. 複製新的 Repository ---"
             
             echo "正在複製 Repository..."
             mkdir -p $DEPLOY_DIR 
             git clone $REPO_URL $DEPLOY_DIR
             cd $DEPLOY_DIR || exit 1
             cp ~/.env ./.env

             echo "--- 3. 執行 Docker Compose 部署 ---"
             # 使用 --build 確保重新編譯 Go 和 Svelte 服務
             /usr/bin/docker compose up -d --build --force-recreate api frontend
             
             echo "✅ 部署成功完成。"